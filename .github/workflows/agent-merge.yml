name: "Agent · Merge"

# Merge gate: admits approved PRs to the merge queue. When a PR gets `agent:approved` (from the
# Reviewer, QA or the Lead, or a human):
#   1. Kill switch: does nothing unless AGENT_AUTO_MERGE == 'true'
#   2. Approval: an agent approval must name the PR's head commit (agent.sh approve), else back to review.
#      A human applying the label approves the head as it is
#   3. Risk: if the linked issue is `risk:high`, a human merges (unless AGENT_AUTO_MERGE_HIGH_RISK == 'true').
#      So does any PR touching AGENT_PROTECTED_PATHS (default .github/, scripts/, templates/). These join
#      the queue too: the Integrator tests them like any other PR (update, checks, QA), then hands them to
#      a human (`agent:needs-human`) naming the tested commit, instead of merging
#   4. Queue: labels the PR `agent:queued` and posts its place in the queue. The Integrator
#      (agent-integrator.yml) merges queued PRs one at a time: it brings each one up to date with the
#      base right before merging, waits for the required checks on exactly that commit, and merges it.
# PR events use pull_request_target: unlike pull_request, it also fires for PRs with merge
# conflicts (GitHub creates no merge commit for those), and it always runs this workflow
# file from the default branch. Jobs only act on same-repo PRs and check out the PR head explicitly.
on:
  pull_request_target:
    types: [labeled]

env:
  AGENT_ESCALATION_ASSIGNEE: ${{ vars.AGENT_ESCALATION_ASSIGNEE }}
  AGENT_BOT_ID: ${{ vars.AGENT_BOT_ID }}   # the App's bot user id: unlike its login, it survives renames

jobs:
  merge:
    # AGENT_PAUSED == 'true' stops every agent job (global pause switch).
    if: >-
      ${{ vars.AGENT_PAUSED != 'true' && (
        github.event.label.name == 'agent:approved' && vars.AGENT_AUTO_MERGE == 'true' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository
      ) }}
    concurrency:
      group: agent-${{ github.event.pull_request.number }}-merge
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TRUSTED: .agent-trusted/.github/agents
      BIN: .agent-trusted/scripts/agents
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .agent-trusted
          sparse-checkout: |
            .github/agents
            scripts/agents
          token: ${{ steps.app.outputs.token }}

      - name: Risk gate
        id: risk
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          HIGH_RISK_OK: ${{ vars.AGENT_AUTO_MERGE_HIGH_RISK }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          SENDER: ${{ github.event.sender.login }}
          PROTECTED: ${{ vars.AGENT_PROTECTED_PATHS || '.github/,scripts/,templates/' }}
        run: |
          "$BIN/agent.sh" merge-risk-gate

      - name: Join the merge queue
        if: steps.risk.outputs.stop != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SENDER_TYPE: ${{ github.event.sender.type }}
          SENDER: ${{ github.event.sender.login }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          "$BIN/agent.sh" merge-join