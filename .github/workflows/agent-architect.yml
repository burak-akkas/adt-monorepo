name: "Agent · Architect"

# Trigger: the issue gets `agent:analyzed` (set by the Analyst, or by a human).
# Records the design risk as a `risk:low|medium|high` label (the Merge gate reads it).
# Next state: low/medium risk -> `agent:ready`. High risk or unsure -> the Lead (`agent:needs-decision`).
# Too big for one PR -> `split`: agent.sh split creates sub-issues (each runs the full pipeline) and the
# issue waits in `agent:split`; agent-subissues.yml closes it when all are done. Sub-issues can split
# once more, down to AGENT_MAX_SPLIT_DEPTH levels (default 2). AGENT_SPLIT == 'false' turns splitting
# off; AGENT_MAX_SUBISSUES caps it (default 5).
# Size check: a `ready` design that plans more than AGENT_MAX_PLANNED_FILES files (default 20) runs
# again with splitting required. A split the Lead asked for works the same way (agent.sh split-mode).
# Optional human gate: with AGENT_REQUIRE_DESIGN_APPROVAL == 'true', every design waits in
# `agent:design-review` until a human applies `agent:ready`.
on:
  issues:
    types: [labeled]

env:
  AGENT_ESCALATION_ASSIGNEE: ${{ vars.AGENT_ESCALATION_ASSIGNEE }}
  AGENT_BOT_ID: ${{ vars.AGENT_BOT_ID }}   # the App's bot user id: unlike its login, it survives renames

jobs:
  architect:
    # AGENT_PAUSED == 'true' stops every agent job (global pause switch).
    if: >-
      ${{ vars.AGENT_PAUSED != 'true' && (
        github.event.label.name == 'agent:analyzed' && !github.event.issue.pull_request
      ) }}
    concurrency:
      group: agent-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ steps.app.outputs.token }}

      - name: Prepare scratch dir
        run: mkdir -p .agent-out && echo ".agent-out/" >> .git/info/exclude

      - name: Count handoff comments
        id: before
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: echo "count=$(scripts/agents/agent.sh count-comments ${{ github.event.issue.number }} architect)" >> "$GITHUB_OUTPUT"

      # allowed / required (the Lead or the size check asked for a split) / not-allowed <reason>
      - name: Split mode
        id: split
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ github.event.issue.number }}
          AGENT_SPLIT: ${{ vars.AGENT_SPLIT }}
          AGENT_MAX_SPLIT_DEPTH: ${{ vars.AGENT_MAX_SPLIT_DEPTH || '2' }}
          MAX: ${{ vars.AGENT_MAX_SUBISSUES || '5' }}
        run: |
          scripts/agents/agent.sh architect-split-mode

      - uses: anthropics/claude-code-action@v1
        id: agent
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          allowed_bots: ${{ steps.app.outputs.app-slug }}[bot]
          prompt: |
            You are the ARCHITECT agent. Read .github/agents/architect.md and follow it exactly.

            Repository: ${{ github.repository }}
            Issue: #${{ github.event.issue.number }}
            Splitting: ${{ steps.split.outputs.text }}
            Size limit: a `ready` design may plan at most ${{ vars.AGENT_MAX_PLANNED_FILES || '20' }} files (tests included); a bigger one is sent back to be split.

            Tool rules: create files only with the Write tool (bodies go in .agent-out/, then use --body-file).
            Run every shell command on its own: no &&, ||, ;, pipes, redirects, heredocs or subshells.
            Compound commands are blocked by the permission system.
          claude_args: |
            --max-turns 40
            ${{ vars.AGENT_MODEL && format('--model {0}', vars.AGENT_MODEL) || '' }}
            --allowedTools "Read,Grep,Glob,Write,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh pr list:*),Bash(git log:*)"
            --json-schema '{"type":"object","properties":{"decision":{"type":"string","enum":["ready","needs-human","split"]},"risk":{"type":"string","enum":["low","medium","high"]},"subtasks":{"type":"array","items":{"type":"object","properties":{"title":{"type":"string"},"summary":{"type":"string"},"acceptance_criteria":{"type":"array","items":{"type":"string"}},"depends_on":{"type":"array","items":{"type":"integer"}}},"required":["title","summary","acceptance_criteria"]}},"files":{"type":"array","items":{"type":"string"}}},"required":["decision","risk"]}'

      - name: Report denied tools
        if: ${{ !cancelled() && steps.agent.outputs.execution_file != '' }}
        run: |
          scripts/agents/agent.sh report-denied "${{ steps.agent.outputs.execution_file }}"

      - name: Apply state transition
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OUT: ${{ steps.agent.outputs.structured_output }}
          N: ${{ github.event.issue.number }}
          BEFORE: ${{ steps.before.outputs.count }}
          REQUIRE_APPROVAL: ${{ vars.AGENT_REQUIRE_DESIGN_APPROVAL }}
          SPLIT_MODE: ${{ steps.split.outputs.mode }}
          AGENT_MAX_SUBISSUES: ${{ vars.AGENT_MAX_SUBISSUES || '5' }}
          MAX_FILES: ${{ vars.AGENT_MAX_PLANNED_FILES || '20' }}
          AVOID_CONFLICTS: ${{ vars.AGENT_AVOID_CONFLICTS != 'false' && 'true' || '' }}
          AGENT_CONFLICT_IGNORE: ${{ vars.AGENT_CONFLICT_IGNORE }}
        run: |
          scripts/agents/agent.sh architect-apply