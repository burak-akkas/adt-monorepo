name: "Agent · Reviewer"

# Triggers:
#   - agent PRs (branch `agent/*`) are opened, updated or marked ready
#   - a human applies `agent:review` to any same-repo PR
# Loop guard: after AGENT_MAX_REVIEW_ROUNDS reviewer summaries since the last Lead decision (default 3) the PR goes to the Lead (`agent:needs-decision`).
# Where an approval goes: with QA on (AGENT_QA) and AGENT_QA_STAGE unset or `queue`, straight to the
# merge gate, and QA tests the PR once at the front of the merge queue, on the code that lands. With
# AGENT_QA_STAGE == 'review', to QA first (the older flow: QA before the queue).
# GitHub's clean update-branch merge on top of an approved commit skips review and QA (CI still runs,
# and the Integrator waits for it). With AGENT_QA_STAGE == 'review', AGENT_QA_ON_BASE_UPDATE == 'true'
# sends it to QA instead.
# A push that keeps the PR's own added/removed lines exactly as approved (a conflict resolution that
# kept both sides, see agent.sh same-own-changes) is treated the same with AGENT_SKIP_REVIEW_ON_SAME_CHANGES == 'true'.
# Otherwise a re-review of an approved PR gets the interdiff of its own edits since the approval.
# PR events use pull_request_target: unlike pull_request, it also fires for PRs with merge
# conflicts (GitHub creates no merge commit for those), and it always runs this workflow
# file from the default branch. Jobs only act on same-repo PRs and check out the PR head explicitly.
on:
  pull_request_target:
    types: [opened, synchronize, ready_for_review, labeled]

env:
  AGENT_ESCALATION_ASSIGNEE: ${{ vars.AGENT_ESCALATION_ASSIGNEE }}
  AGENT_BOT_ID: ${{ vars.AGENT_BOT_ID }}   # the App's bot user id: unlike its login, it survives renames

jobs:
  review:
    # AGENT_PAUSED == 'true' stops every agent job (global pause switch).
    if: >-
      ${{ vars.AGENT_PAUSED != 'true' && (
        !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && ( (github.event.action != 'labeled' && startsWith(github.event.pull_request.head.ref, 'agent/')) || (github.event.action == 'labeled' && github.event.label.name == 'agent:review') )
      ) }}
    concurrency:
      group: agent-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      PR: ${{ github.event.pull_request.number }}
      TRUSTED: .agent-trusted/.github/agents
      BIN: .agent-trusted/scripts/agents
      MAX_ROUNDS: ${{ vars.AGENT_MAX_REVIEW_ROUNDS || '3' }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          token: ${{ steps.app.outputs.token }}

      # Role prompts and scripts always come from the default branch,
      # so a PR cannot rewrite its own reviewer instructions.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .agent-trusted
          sparse-checkout: |
            .github/agents
            scripts/agents
          token: ${{ steps.app.outputs.token }}

      - name: Loop guard
        id: guard
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          # QA before the queue (AGENT_QA_STAGE == 'review') only; QA in the queue is the Integrator's.
          QA: ${{ vars.AGENT_QA == 'true' && vars.AGENT_QA_STAGE == 'review' && 'true' || '' }}
          QA_ON_BASE_UPDATE: ${{ vars.AGENT_QA_ON_BASE_UPDATE }}
          SKIP_SAME: ${{ vars.AGENT_SKIP_REVIEW_ON_SAME_CHANGES }}
        run: |
          "$BIN/agent.sh" reviewer-guard "${{ github.event.pull_request.head.sha }}" "${{ github.event.action }}"

      - uses: anthropics/claude-code-action@v1
        id: agent
        if: steps.guard.outputs.stop != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          allowed_bots: ${{ steps.app.outputs.app-slug }}[bot]
          prompt: |
            You are the REVIEWER agent. Read ${{ env.TRUSTED }}/reviewer.md and follow it exactly.

            Repository: ${{ github.repository }}
            Pull request: #${{ github.event.pull_request.number }}
            Review round: ${{ steps.guard.outputs.round }} of ${{ env.MAX_ROUNDS }}
            ${{ steps.guard.outputs.interdiff && format('Re-review: this PR was approved at {0} and has changed since, usually because the Implementor merged the default branch and resolved conflicts. {1} shows how the PR''s own added/removed lines changed since that approval. Follow "Re-review after an approval" in reviewer.md.', steps.guard.outputs.approved, steps.guard.outputs.interdiff) || '' }}

            Tool rules: create files only with the Write tool (bodies go in .agent-out/, then use --body-file).
            Run every shell command on its own: no &&, ||, ;, pipes, redirects, heredocs or subshells.
            Compound commands are blocked by the permission system.
          # Tip: use a different (stronger) model than the Implementor, via AGENT_REVIEWER_MODEL.
          claude_args: |
            --max-turns 40
            ${{ (vars.AGENT_REVIEWER_MODEL || vars.AGENT_MODEL) && format('--model {0}', vars.AGENT_REVIEWER_MODEL || vars.AGENT_MODEL) || '' }}
            --allowedTools "Read,Grep,Glob,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh issue view:*),mcp__github_inline_comment__create_inline_comment"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["approve","request-changes","needs-human"]}},"required":["verdict"]}'

      - name: Report denied tools
        if: ${{ !cancelled() && steps.agent.outputs.execution_file != '' }}
        run: |
          "$BIN/agent.sh" report-denied "${{ steps.agent.outputs.execution_file }}"

      - name: Apply state transition
        if: ${{ !cancelled() && steps.guard.outputs.stop != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OUT: ${{ steps.agent.outputs.structured_output }}
          QA: ${{ vars.AGENT_QA == 'true' && vars.AGENT_QA_STAGE == 'review' && 'true' || '' }}
          QA_IN_QUEUE: ${{ vars.AGENT_QA == 'true' && vars.AGENT_QA_STAGE != 'review' && 'true' || '' }}
          QA_PATHS: ${{ vars.AGENT_QA_PATHS }}
        run: |
          "$BIN/agent.sh" reviewer-apply "${{ github.event.pull_request.head.sha }}" "${{ steps.guard.outputs.total }}" "${{ steps.guard.outputs.round }}"