name: E2E

# Runs on every PR, whatever it changes: the required check that every PR has.
on:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: docker compose up -d --wait db
      - name: Start the stack
        run: |
          nohup bash tools/start-stack.sh 3000 4000 kanban_e2e > stack.log 2>&1 &
          for _ in $(seq 1 90); do
            if curl -fsS -o /dev/null http://localhost:3000/; then exit 0; fi
            sleep 2
          done
          cat stack.log
          exit 1
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            stack.log
          retention-days: 7
