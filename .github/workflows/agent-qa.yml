name: "Agent · QA"

# Runs when a PR gets `agent:qa`: by default the Integrator holds the PR at the front of the merge queue
# (up to date, required checks green) and the queue waits for QA's verdict. With AGENT_QA_STAGE == 'review',
# right after the Reviewer approved. The Lead can also send a PR to QA.
#   1. Waits for the required checks (AGENT_REQUIRED_CHECKS): red goes straight back to the Implementor, no QA run
#      Then waits until the PR preview serves this exact commit (<preview>/version.txt == head SHA)
#   2. Runs the project's Playwright e2e suite against the preview
#   3. The QA agent tests the acceptance criteria in a real browser (Playwright MCP), compares the changed
#      screens with the baseline site (the base branch, before this PR) and takes screenshots
#   4. Screenshots go to the PR as a gallery. pass -> merge gate, which hands a held PR back to the Integrator
#      (or queues it), fail -> Implementor fixes (and the queue moves on), unsure -> Lead
# Preview URL template: AGENT_PREVIEW_URL (default https://{owner}.github.io/{repo}/pr-{pr}/), serving
# version.txt with the commit it was built from. `deployment`: the URL of a successful GitHub deployment of
# the PR's head commit (Vercel, Netlify, Render…; AGENT_PREVIEW_ENVIRONMENT narrows it). `none`: no
# preview deploy; QA starts the app itself with AGENT_QA_START_COMMAND and tests AGENT_QA_LOCAL_URL
# (default http://localhost:3000/) on the runner.
# The e2e suite: AGENT_E2E_SETUP (default `npm ci`) then AGENT_E2E_COMMAND (default `npx playwright test`),
# with E2E_BASE_URL set to the URL under test. AGENT_E2E_COMMAND=none skips the suite.
# Toolchain: AGENT_NODE_VERSION (`none` skips Node; QA's browser tools still need npx, so keep Node
# when QA is on), AGENT_SETUP_COMMAND (runs before the e2e setup).
# Screenshots: AGENT_QA_SCREENSHOTS=pages (gh-pages branch, shown inline in the PR; the default for
# public repositories) or artifact (only the run's artifacts, linked from the PR; the default for
# private repositories, where raw gh-pages image links don't render).
# Baseline URL template: AGENT_BASELINE_URL (default https://{owner}.github.io/{repo}/, the production deploy
# of the base branch; `none` turns the visual comparison off). It should serve version.txt too.
# AGENT_BASELINE_START_COMMAND: start the baseline on the runner instead, from a checkout of the base branch
# outside the workspace, answering at AGENT_BASELINE_LOCAL_URL (default http://localhost:3001/). For apps that
# store data on a server, where QA must not write test data to production. It needs its own port and database.
# PR events use pull_request_target: unlike pull_request, it also fires for PRs with merge
# conflicts (GitHub creates no merge commit for those), and it always runs this workflow
# file from the default branch. Jobs only act on same-repo PRs and check out the PR head explicitly.
on:
  pull_request_target:
    types: [labeled]

env:
  AGENT_ESCALATION_ASSIGNEE: ${{ vars.AGENT_ESCALATION_ASSIGNEE }}
  AGENT_BOT_ID: ${{ vars.AGENT_BOT_ID }}   # the App's bot user id: unlike its login, it survives renames

jobs:
  qa:
    # AGENT_PAUSED == 'true' stops every agent job (global pause switch).
    if: >-
      ${{ vars.AGENT_PAUSED != 'true' && (
        github.event.label.name == 'agent:qa' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository
      ) }}
    concurrency:
      group: agent-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    env:
      PR: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      TRUSTED: .agent-trusted/.github/agents
      BIN: .agent-trusted/scripts/agents
      MAX_ROUNDS: ${{ vars.AGENT_MAX_QA_ROUNDS || '3' }}
      URL_TEMPLATE: ${{ vars.AGENT_PREVIEW_URL || 'https://{owner}.github.io/{repo}/pr-{pr}/' }}
      # The baseline defaults to the production site; without GitHub Pages previews, to AGENT_PRODUCTION_URL or none.
      BASELINE_TEMPLATE: ${{ vars.AGENT_BASELINE_URL || ((vars.AGENT_PREVIEW_URL == 'none' || vars.AGENT_PREVIEW_URL == 'deployment') && (vars.AGENT_PRODUCTION_URL || 'none')) || vars.AGENT_PRODUCTION_URL || 'https://{owner}.github.io/{repo}/' }}
      LOCAL: ${{ vars.AGENT_PREVIEW_URL == 'none' && 'true' || '' }}
      LOCAL_URL: ${{ vars.AGENT_QA_LOCAL_URL || 'http://localhost:3000/' }}
      SCREENSHOTS: ${{ vars.AGENT_QA_SCREENSHOTS || (github.event.repository.private && 'artifact') || 'pages' }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          token: ${{ steps.app.outputs.token }}
          # QA runs the PR's code (npm ci, the e2e suite, the started app): leave no token in .git/config
          # for it. Later steps use GH_TOKEN, and the agent action sets up its own git auth.
          persist-credentials: false

      # Role prompts and scripts always come from the default branch.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .agent-trusted
          sparse-checkout: |
            .github/agents
            scripts/agents
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - name: Round guard
        id: guard
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          "$BIN/agent.sh" qa-guard

      # QA is the most expensive agent run, and the merge queue requires these checks anyway: don't
      # spend a QA round on a commit that can never merge. Red checks go straight back to the Implementor.
      - name: Wait for required checks
        id: ci
        if: steps.guard.outputs.stop != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AGENT_REQUIRED_CHECKS: ${{ vars.AGENT_REQUIRED_CHECKS || 'CI' }}
        run: |
          "$BIN/agent.sh" qa-wait-checks

      - name: Wait for the preview of this commit
        id: preview
        if: steps.guard.outputs.stop != 'true' && steps.ci.outputs.result != 'fail' && env.LOCAL != 'true'
        env:
          URL: ${{ steps.guard.outputs.url }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
          ENVIRONMENT: ${{ vars.AGENT_PREVIEW_ENVIRONMENT }}
        run: |
          "$BIN/agent.sh" qa-wait-preview

      # The project's toolchain (same variables as the Implementor). The npm cache only when the
      # project uses npm (a package-lock.json at the root).
      - uses: actions/setup-node@v4
        if: (steps.preview.outputs.ready == 'true' || (env.LOCAL == 'true' && steps.guard.outputs.stop != 'true' && steps.ci.outputs.result != 'fail')) && vars.AGENT_NODE_VERSION != 'none'
        with:
          node-version: ${{ vars.AGENT_NODE_VERSION || '22' }}
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Project setup
        if: (steps.preview.outputs.ready == 'true' || (env.LOCAL == 'true' && steps.guard.outputs.stop != 'true' && steps.ci.outputs.result != 'fail')) && vars.AGENT_SETUP_COMMAND != ''
        env:
          SETUP: ${{ vars.AGENT_SETUP_COMMAND }}
        run: bash -eo pipefail -c "$SETUP"

      # Before anything starts: `npm ci` deletes node_modules, also under an app that is already running.
      - name: E2E setup
        if: (steps.preview.outputs.ready == 'true' || (env.LOCAL == 'true' && steps.guard.outputs.stop != 'true' && steps.ci.outputs.result != 'fail'))
        env:
          E2E_SETUP: ${{ vars.AGENT_E2E_SETUP || 'npm ci' }}
          E2E_COMMAND: ${{ vars.AGENT_E2E_COMMAND || 'npx playwright test' }}
        run: |
          "$BIN/agent.sh" qa-e2e-setup

      # The baseline on the runner (AGENT_BASELINE_START_COMMAND): the base branch, for QA's visual comparison.
      # It moves out of the workspace first, so that the PR's own build and tests never pick up its files.
      - uses: actions/checkout@v6
        if: (steps.preview.outputs.ready == 'true' || (env.LOCAL == 'true' && steps.guard.outputs.stop != 'true' && steps.ci.outputs.result != 'fail')) && vars.AGENT_BASELINE_START_COMMAND != ''
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: .agent-baseline
          fetch-depth: 1
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - name: Start the baseline locally
        id: baseline_local
        if: (steps.preview.outputs.ready == 'true' || (env.LOCAL == 'true' && steps.guard.outputs.stop != 'true' && steps.ci.outputs.result != 'fail')) && vars.AGENT_BASELINE_START_COMMAND != ''
        env:
          START: ${{ vars.AGENT_BASELINE_START_COMMAND }}
          URL: ${{ vars.AGENT_BASELINE_LOCAL_URL || 'http://localhost:3001/' }}
        run: |
          "$BIN/agent.sh" qa-start-baseline

      # No preview deploy (AGENT_PREVIEW_URL=none): start the app on the runner and wait until it answers.
      - name: Start the app locally
        id: local
        if: env.LOCAL == 'true' && steps.guard.outputs.stop != 'true' && steps.ci.outputs.result != 'fail'
        env:
          START: ${{ vars.AGENT_QA_START_COMMAND }}
          URL: ${{ steps.guard.outputs.url }}
        run: |
          "$BIN/agent.sh" qa-start-app

      # The "before" side of QA's visual comparison. It's informational: QA runs either way, and is told
      # when the baseline lags the base branch (e.g. a production deploy still running).
      - name: Find the baseline
        id: baseline
        if: steps.preview.outputs.ready == 'true' || steps.local.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BASE: ${{ github.event.pull_request.base.ref }}
          LOCAL_BASELINE: ${{ steps.baseline_local.outputs.info }}
        run: |
          "$BIN/agent.sh" qa-find-baseline

      - name: Run e2e suite
        id: e2e
        if: steps.preview.outputs.ready == 'true' || steps.local.outputs.ready == 'true'
        env:
          E2E_BASE_URL: ${{ steps.preview.outputs.url || steps.guard.outputs.url }}
          CI: "true"
          E2E_COMMAND: ${{ vars.AGENT_E2E_COMMAND || 'npx playwright test' }}
        run: |
          "$BIN/agent.sh" qa-run-e2e

      - uses: anthropics/claude-code-action@v1
        id: agent
        if: steps.preview.outputs.ready == 'true' || steps.local.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          allowed_bots: ${{ steps.app.outputs.app-slug }}[bot]
          prompt: |
            You are the QA agent. Read ${{ env.TRUSTED }}/qa.md and follow it exactly.

            Repository: ${{ github.repository }}
            Pull request: #${{ github.event.pull_request.number }}
            QA round: ${{ steps.guard.outputs.round }} of ${{ env.MAX_ROUNDS }}
            Preview URL (serving commit ${{ github.event.pull_request.head.sha }}): ${{ steps.preview.outputs.url || steps.guard.outputs.url }}
            Baseline URL (the base branch without this PR): ${{ steps.baseline.outputs.info }}
            ${{ env.LOCAL == 'true' && 'The URL is the app running on this machine (no preview deploy): test it the same way.' || '' }}
            Automated e2e results: .agent-out/e2e-results.txt (exit code ${{ steps.e2e.outputs.exit }}; 0 = all passed, none = the project has no e2e suite)

            Tool rules: create files only with the Write tool (bodies go in .agent-out/, then use --body-file).
            Run every shell command on its own: no &&, ||, ;, pipes, redirects, heredocs or subshells.
            Compound commands are blocked by the permission system.
          claude_args: |
            --max-turns 80
            ${{ (vars.AGENT_QA_MODEL || vars.AGENT_MODEL) && format('--model {0}', vars.AGENT_QA_MODEL || vars.AGENT_MODEL) || '' }}
            --mcp-config ${{ github.workspace }}/.agent-out/mcp.json
            --allowedTools "Read,Grep,Glob,Write,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(gh issue view:*),mcp__playwright"
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["pass","fail","needs-human"]},"screenshots":{"type":"array","items":{"type":"object","properties":{"file":{"type":"string"},"caption":{"type":"string"}},"required":["file"]}}},"required":["verdict"]}'

      - name: Report denied tools
        if: ${{ !cancelled() && steps.agent.outputs.execution_file != '' }}
        run: |
          "$BIN/agent.sh" report-denied "${{ steps.agent.outputs.execution_file }}"

      # Screenshots are committed to gh-pages (qa/pr-N/<run>/) and embedded via raw URLs,
      # so they show up in the PR right away. pages-janitor.yml removes them AGENT_QA_SCREENSHOT_DAYS (default 7) after the PR closes.
      - name: Publish screenshots
        if: ${{ !cancelled() && steps.agent.outcome != 'skipped' && env.SCREENSHOTS == 'pages' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OUT: ${{ steps.agent.outputs.structured_output }}
          KEEP_DAYS: ${{ vars.AGENT_QA_SCREENSHOT_DAYS || '7' }}
        run: |
          "$BIN/agent.sh" qa-publish-screenshots "${{ steps.guard.outputs.round }}"

      # Screenshots get their own artifact with the images at its top level: inside a bigger one they'd sit in
      # .agent-out/, a folder that macOS and others hide after unzipping.
      - uses: actions/upload-artifact@v4
        id: artifact
        if: ${{ !cancelled() && steps.agent.outcome != 'skipped' }}
        with:
          name: qa-pr-${{ github.event.pull_request.number }}-round-${{ steps.guard.outputs.round }}-screenshots
          path: |
            .agent-out/screenshots/*.png
            .agent-out/screenshots/*.jpeg
            .agent-out/screenshots/*.jpg
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.agent.outcome != 'skipped' }}
        with:
          name: qa-pr-${{ github.event.pull_request.number }}-round-${{ steps.guard.outputs.round }}-e2e
          path: |
            .agent-out/e2e-results.txt
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      # AGENT_QA_SCREENSHOTS=artifact (default for private repositories): the PR gets the captions and a
      # link to the run's artifact instead of inline images.
      - name: Link screenshots
        if: ${{ !cancelled() && steps.agent.outcome != 'skipped' && env.SCREENSHOTS == 'artifact' && steps.artifact.outputs.artifact-url != '' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OUT: ${{ steps.agent.outputs.structured_output }}
          LINK: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          "$BIN/agent.sh" qa-link-screenshots "${{ steps.guard.outputs.round }}"

      - name: Apply state transition
        if: ${{ !cancelled() && steps.guard.outputs.stop != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OUT: ${{ steps.agent.outputs.structured_output }}
          READY: ${{ steps.preview.outputs.ready || steps.local.outputs.ready }}
          CI_RESULT: ${{ steps.ci.outputs.result }}
          CI_FAILED: ${{ steps.ci.outputs.failed }}
          URL: ${{ steps.preview.outputs.url || steps.guard.outputs.url }}
        run: |
          "$BIN/agent.sh" qa-apply "${{ steps.guard.outputs.total }}" "${{ steps.guard.outputs.round }}" "${{ steps.e2e.outputs.exit }}"