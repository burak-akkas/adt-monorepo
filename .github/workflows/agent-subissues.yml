name: "Agent · Sub-issues"

# Trigger: any issue is closed, by a merged PR, by the Lead or by a human.
# For an issue created by agent.sh split (the Architect split its parent):
#   - completed: unblocks sibling sub-issues whose dependencies are all done (`agent:blocked` -> `agent:analyzed`)
#     and closes the parent when every sub-issue is done
#   - not planned: hands the parent to the Lead
# For any issue: restarts issues the Implementor parked until it closed (agent.sh release-blocked).
on:
  issues:
    types: [closed]

env:
  AGENT_ESCALATION_ASSIGNEE: ${{ vars.AGENT_ESCALATION_ASSIGNEE }}
  AGENT_BOT_ID: ${{ vars.AGENT_BOT_ID }}   # the App's bot user id: unlike its login, it survives renames

jobs:
  advance:
    # AGENT_PAUSED == 'true' stops every agent job (global pause switch).
    if: >-
      ${{ vars.AGENT_PAUSED != 'true' && (
        !github.event.issue.pull_request
      ) }}
    # One at a time across the repo: two sub-issues closing together must not both close the parent.
    concurrency:
      group: agent-subissues
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: scripts/agents
          token: ${{ steps.app.outputs.token }}

      - name: Unblock sub-issues, close the parent when all are done
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          CLOSED: ${{ github.event.issue.number }}
        # The sweep catches up on closures whose runs GitHub dropped from the shared queue.
        # agent.sh subissues does nothing for an issue that isn't a sub-issue.
        run: |
          scripts/agents/agent.sh subissues "$CLOSED" | tee -a "$GITHUB_STEP_SUMMARY"
          scripts/agents/agent.sh subissues --sweep | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Restart issues that waited for this one
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: scripts/agents/agent.sh release-blocked | tee -a "$GITHUB_STEP_SUMMARY"
