name: "Agent · Lead"

# The decision maker. Runs when any issue or PR gets `agent:needs-decision`
# (open questions, high-risk design, review deadlock, agent failure).
# It picks one action that unblocks the team, or escalates to a human (`agent:needs-human`).
# Budget: AGENT_MAX_LEAD_DECISIONS per item (default 3) since its last escalation to a human, then it
# escalates. When a human sends an escalated item back to the team, the Lead gets a fresh budget.
# On an issue, `split` sends it back to the Architect with splitting required (agent.sh split-mode).
# PR events use pull_request_target: unlike pull_request, it also fires for PRs with merge
# conflicts (GitHub creates no merge commit for those), and it always runs this workflow
# file from the default branch. Jobs only act on same-repo PRs and check out the PR head explicitly.
on:
  issues:
    types: [labeled]
  pull_request_target:
    types: [labeled]

env:
  AGENT_ESCALATION_ASSIGNEE: ${{ vars.AGENT_ESCALATION_ASSIGNEE }}
  AGENT_BOT_ID: ${{ vars.AGENT_BOT_ID }}   # the App's bot user id: unlike its login, it survives renames

jobs:
  lead:
    # AGENT_PAUSED == 'true' stops every agent job (global pause switch).
    if: >-
      ${{ vars.AGENT_PAUSED != 'true' && (
        github.event.label.name == 'agent:needs-decision' && (github.event_name == 'issues' || github.event.pull_request.head.repo.full_name == github.repository)
      ) }}
    concurrency:
      group: agent-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      N: ${{ github.event.issue.number || github.event.pull_request.number }}
      KIND: ${{ github.event_name == 'issues' && 'issue' || 'pr' }}
      TRUSTED: .agent-trusted/.github/agents
      BIN: .agent-trusted/scripts/agents
      MAX_DECISIONS: ${{ vars.AGENT_MAX_LEAD_DECISIONS || '3' }}
      AGENT_SPLIT: ${{ vars.AGENT_SPLIT }}                                  # agent.sh split-mode
      AGENT_MAX_SPLIT_DEPTH: ${{ vars.AGENT_MAX_SPLIT_DEPTH || '2' }}
    steps:
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ vars.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.repository.default_branch }}
          fetch-depth: 1
          token: ${{ steps.app.outputs.token }}

      # Role prompts and scripts always come from the default branch.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: .agent-trusted
          sparse-checkout: |
            .github/agents
            scripts/agents
          token: ${{ steps.app.outputs.token }}

      - name: Decision budget
        id: guard
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          "$BIN/agent.sh" lead-guard

      - uses: anthropics/claude-code-action@v1
        id: agent
        if: steps.guard.outputs.stop != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          allowed_bots: ${{ steps.app.outputs.app-slug }}[bot]
          prompt: |
            You are the LEAD agent. Read ${{ env.TRUSTED }}/lead.md and follow it exactly.
            The other roles are described in ${{ env.TRUSTED }}/ (analyst.md, architect.md, implementor.md, reviewer.md, qa.md).

            Repository: ${{ github.repository }}
            Item: ${{ env.KIND }} #${{ env.N }}
            Default branch: ${{ github.event.repository.default_branch }} (all agent branches start from it and PRs target it)
            Decisions already made on this item: ${{ steps.guard.outputs.used }} of ${{ env.MAX_DECISIONS }} (since its last escalation to a human)
            ${{ env.KIND == 'issue' && format('Splitting this issue into sub-issues: {0}', steps.guard.outputs.split_text) || '' }}

            Tool rules: create files only with the Write tool (bodies go in .agent-out/, then use --body-file).
            Run every shell command on its own: no &&, ||, ;, pipes, redirects, heredocs or subshells.
            Compound commands are blocked by the permission system.
          claude_args: |
            --max-turns 40
            ${{ (vars.AGENT_LEAD_MODEL || vars.AGENT_MODEL) && format('--model {0}', vars.AGENT_LEAD_MODEL || vars.AGENT_MODEL) || '' }}
            --allowedTools "Read,Grep,Glob,Write,Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*),Bash(git log:*)"
            --json-schema '{"type":"object","properties":{"action":{"type":"string","enum":["restart-analysis","redesign","split","implement","fix","re-review","qa","approve","close","escalate"]},"rationale":{"type":"string"}},"required":["action","rationale"]}'

      - name: Report denied tools
        if: ${{ !cancelled() && steps.agent.outputs.execution_file != '' }}
        run: |
          "$BIN/agent.sh" report-denied "${{ steps.agent.outputs.execution_file }}"

      - name: Apply decision
        if: ${{ !cancelled() && steps.guard.outputs.stop != 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OUT: ${{ steps.agent.outputs.structured_output }}
          TOTAL: ${{ steps.guard.outputs.total }}
          SPLIT: ${{ steps.guard.outputs.split }}
        run: |
          "$BIN/agent.sh" lead-apply "${{ github.event.pull_request.head.sha }}"